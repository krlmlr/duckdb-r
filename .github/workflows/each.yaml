# Helper workflow to build every commit on a branch that has no rcc result yet.
#
# On a series branch (`<S>-dev` with a sibling `<S>-green`), only commits in
#   `<S>-green..HEAD` are considered -- the series loop's world; nothing is built
#   when green is not an ancestor of HEAD. On branches without a green sibling,
#   the first-parent history since $SINCE is scanned. Either way, a commit is
#   built only if it is undecided, oldest first, and gets a verdict of its own.
#   Rebasing and force-pushing a commit past the boundary still re-triggers it.
#
# The run plans contiguous, cost-balanced *shards* and gives each shard one job,
# which walks its commits in a single workspace. The batch is then one thing to
# cancel, the R/dependency setup is paid per shard rather than per commit, and
# consecutive commits hit the runner's local ccache -- a typical adjacent vendor
# commit recompiles ~5 of 341 unity objects.
#
# Packing commits that tightly is the cheapest plan and the slowest one: a
# 25-commit batch fits in two 5-hour legs. So the planner replans the same range
# against shorter per-leg deadlines and keeps whichever plan finishes soonest
# with EACH_MAX_PARALLEL legs running at a time, spending at most
# EACH_SPLIT_FACTOR times the runner minutes of the cheapest plan.
#
# Shards are numbered along the history -- shard 1 is the oldest slice, shard N
# the branch tip -- and queued in that same order, so under max-parallel
# throttling the oldest undecided slice is decided first, which is the only end
# `<S>-green` can advance from. A leg that fails a commit quotes the tail
# of every stage that failed into its job summary, so the run summary says what
# broke without opening the log.
#
# The planner, the leg and the follow-up are cynkra/cynkratemplate's each-plan, each-shard and each-follow-up
# actions; this package provides the gates and the store scripts under scripts/, and its cost model as
# repository variables (the plan job's first step names any that is missing).
#
# See handbook/operations/ci/per-commit/README.md for the design, the GitHub Actions limits it works within,
# and why `workflow_call` is not the mechanism that gets us there.

on:
  push:
    branches:
      - each-*
      - '*-dev'
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest commit date to consider (ISO 8601)"
        type: string
        default: ""
      shard-budget-minutes:
        description: "Build-time target per shard, excluding setup; the GitHub job limit is 360"
        type: string
        default: ""
      max-parallel:
        description: "Shards to build concurrently"
        type: string
        default: ""
      split-factor:
        description: "Runner minutes the plan may cost, relative to the fewest-shards plan, to shorten wall clock (1.0 = never rebalance)"
        type: string
        default: ""
      max-commits:
        description: "Cap on commits considered (0 = no cap), newest kept"
        type: string
        default: ""
      force:
        description: "Rebuild commits that already have a verdict"
        type: boolean
        default: false
      follow-up-of:
        description: "The run this one follows up, set by that run (the each-follow-up action)"
        type: string
        default: ""
      follow-up-head:
        description: "The commit that run planned from, set by it once it judged its retry tip again; a retry tip equal to it is not replanned"
        type: string
        default: ""
  workflow_call:
    inputs:
      branch:
        description: "Branch ref to trigger rcc for (e.g. refs/heads/main-dev)"
        required: true
        type: string
      since:
        description: "Earliest commit date to consider (ISO 8601)"
        required: false
        type: string
        default: ""
      shard-budget-minutes:
        description: "Build-time target per shard, excluding setup"
        required: false
        type: string
        default: ""
      max-parallel:
        description: "Shards to build concurrently"
        required: false
        type: string
        default: ""
      split-factor:
        description: "Runner minutes the plan may cost, relative to the fewest-shards plan, to shorten wall clock"
        required: false
        type: string
        default: ""
      max-commits:
        description: "Cap on commits considered (0 = no cap), newest kept"
        required: false
        type: string
        default: ""

name: each-rcc

# One planning/building pass per branch at a time. `cancel-in-progress: false`
# on purpose: a queued run must wait for a long bulk build rather than kill it,
# because a killed leg leaves its in-flight commit undecided.
#
# This group, plus work-selection being a pure function of durable verdicts, is
# the whole of what keeps a commit from being built twice. There is no running
# marker and there is not meant to be one -- see handbook/operations/ci/per-commit/selection/README.md, "No running
# marker, by design".
concurrency:
  group: each-rcc-${{ inputs.branch || github.ref }}
  cancel-in-progress: false

env:
  EACH_SINCE: ${{ inputs.since || vars.EACH_RCC_SINCE }}
  EACH_SHARD_BUDGET_MINUTES: ${{ inputs.shard-budget-minutes || '300' }}
  EACH_MAX_PARALLEL: ${{ inputs.max-parallel || vars.EACH_RCC_MAX_PARALLEL || '20' }}
  EACH_MAX_COMMITS: ${{ inputs.max-commits || '0' }}
  EACH_SPLIT_FACTOR: ${{ inputs.split-factor || vars.EACH_RCC_SPLIT_FACTOR || '1.5' }}

jobs:
  plan:
    if: github.repository == 'krlmlr/duckdb-r'
    runs-on: ubuntu-26.04

    # A full clone, the cost map and the partition.
    timeout-minutes: 15

    name: "Plan per-commit rcc builds"

    outputs:
      # The fallbacks cover a planning step that did not run at all: `build` is
      # guarded by `shards != '0'`, but its `strategy` must still parse.
      matrix: ${{ steps.plan.outputs.matrix || '{"shard":["none"]}' }}
      shards: ${{ steps.plan.outputs.shards || '0' }}
      commits: ${{ steps.plan.outputs.commits || '0' }}
      max_parallel: ${{ steps.plan.outputs.max_parallel || '1' }}

    permissions:
      contents: read

    # Begin custom: services
    # End custom: services

    steps:
      # The cost model and the scan start are this package's own, kept as repository variables;
      # without them the planner would fail later, or plan with another package's numbers.
      - name: Check the repository variables
        env:
          EACH_RCC_SINCE: ${{ vars.EACH_RCC_SINCE }}
          EACH_RCC_SETUP_MINUTES: ${{ vars.EACH_RCC_SETUP_MINUTES }}
          EACH_RCC_FULL_BUILD_MINUTES: ${{ vars.EACH_RCC_FULL_BUILD_MINUTES }}
          EACH_RCC_FLOOR_MINUTES: ${{ vars.EACH_RCC_FLOOR_MINUTES }}
          EACH_RCC_OBJECT_SECONDS: ${{ vars.EACH_RCC_OBJECT_SECONDS }}
        run: |
          missing=()
          for name in EACH_RCC_SINCE EACH_RCC_SETUP_MINUTES EACH_RCC_FULL_BUILD_MINUTES EACH_RCC_FLOOR_MINUTES EACH_RCC_OBJECT_SECONDS; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Repository variables not set: ${missing[*]}. Set them under Settings > Secrets and variables > Actions > Variables (see handbook/operations/ci/per-commit/planning/README.md)."
            exit 1
          fi
        shell: bash

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      # Uploads the plan as the `each-plan` artifact the legs and the follow-up download.
      - id: plan
        uses: cynkra/cynkratemplate/.github/actions/each-plan@claude/each-actions
        with:
          since: ${{ env.EACH_SINCE }}
          shard-budget-minutes: ${{ env.EACH_SHARD_BUDGET_MINUTES }}
          max-parallel: ${{ env.EACH_MAX_PARALLEL }}
          max-commits: ${{ env.EACH_MAX_COMMITS }}
          split-factor: ${{ env.EACH_SPLIT_FACTOR }}
          force: ${{ inputs.force || false }}
          follow-up-of: ${{ inputs.follow-up-of }}
          follow-up-head: ${{ inputs.follow-up-head }}
          # The cost model, fitted to this package's own legs (handbook/operations/ci/per-commit/planning/README.md).
          setup-minutes: ${{ vars.EACH_RCC_SETUP_MINUTES }}
          full-build-minutes: ${{ vars.EACH_RCC_FULL_BUILD_MINUTES }}
          floor-minutes: ${{ vars.EACH_RCC_FLOOR_MINUTES }}
          object-seconds: ${{ vars.EACH_RCC_OBJECT_SECONDS }}

  build:
    needs:
      - plan

    if: needs.plan.outputs.shards != '0'

    runs-on: ubuntu-26.04

    # Below GitHub's 6 h ceiling, and above the leg's own deadline: the leg is
    # meant to stop itself and report what it deferred, not to be killed
    # mid-commit and leave a `pending` status behind.
    timeout-minutes: 350

    name: "shard ${{ matrix.shard }} (${{ matrix.label }})"

    permissions:
      # `write` for the snapshot-<sha>-rcc-smoke-null branches: the snapshots
      # gate publishes accepted snapshots as a branch off the commit under test,
      # the way peter-evans/create-pull-request does, and tooling looks those
      # up by name.
      contents: write
      statuses: write
      actions: read

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # Begin custom: services
    # End custom: services

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - uses: cynkra/cynkratemplate/.github/actions/git-identity@main

      - uses: ./.github/workflows/custom/before-install
        if: hashFiles('.github/workflows/custom/before-install/action.yml') != ''

      - uses: cynkra/cynkratemplate/.github/actions/install@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-version: each-rcc-1
          needs: build, check, website, roxygen2
          extra-packages: any::rcmdcheck r-lib/roxygen2 any::decor r-lib/pkgdown deps::.

      # Deliberately not custom/after-install: its ccache-action caps the cache
      # at 200 MB and its duckdb.tar archive is keyed on the whole vendored tree,
      # so both are per-commit constructs a multi-commit job cannot use. The
      # each-shard action keeps one large local cache outside the workspace
      # instead, with ccache's default hash_dir.

      # Run for its tool installation only (air, clang-format). The formatting it
      # performs on the tip checkout is discarded: the each-shard action resets
      # the workspace before every commit.
      - uses: cynkra/cynkratemplate/.github/actions/style@main

      # Downloads the plan, points ccache outside the workspace, walks the shard,
      # and uploads `each-logs-<shard>-<attempt>`, also when the walk fails.
      # That artifact is what a firing reads. The per-commit publish to `rcc2` is
      # the copy, and the artifact is the source: one record and one log per
      # commit the leg decided, in the same bytes (.claude/skills/series-loop/SKILL.md
      # stage 2). It is named per *attempt*: a re-run of a leg resumes, so read
      # every `each-logs-*` for a run, not just the newest. Past its 14 days the
      # same content is inline in the leg's job log, one `::group::<sha>` section
      # per commit.
      - uses: cynkra/cynkratemplate/.github/actions/each-shard@claude/each-actions
        with:
          shard: ${{ matrix.shard }}
          token: ${{ secrets.GITHUB_TOKEN }}
          deadline-minutes: ${{ env.EACH_SHARD_BUDGET_MINUTES }}
          # Empty falls through to the script's own default; 0 turns the
          # per-failure log excerpts in the job summary off.
          summary-tail: ${{ vars.EACH_RCC_SUMMARY_TAIL || '' }}

  # A leg that reaches its deadline defers the commits it did not get to, and
  # nothing else would plan them before the next push. So the run dispatches
  # itself once more on the branch, and the follow-up waits in the branch's
  # concurrency group, `each-rcc-<ref>`, until this run completes, then plans
  # whatever is still undecided. When it dispatches, and why a chain of
  # follow-ups ends, is stated once, in "The follow-up run" of
  # handbook/operations/ci/per-commit/legs/README.md; the each-follow-up action
  # holds the mechanism.
  #
  # `!cancelled()` rather than the implicit `success()`, so that a leg that
  # failed or timed out is followed up, while a run somebody cancelled stays
  # retired. `needs.plan.result` keeps the job off where `plan` is skipped and
  # has no outputs to compare.
  follow-up:
    needs:
      - plan
      - build

    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shards != '0' }}

    runs-on: ubuntu-26.04

    # Two git reads, a records fetch and two API calls: minutes at the very
    # most, and nothing worth an hour of a stuck runner.
    timeout-minutes: 10

    name: "Follow up on undecided commits"

    permissions:
      contents: read
      # Dispatches the follow-up, and lists the runs already waiting on the branch.
      actions: write

    steps:
      # The scripts of the commit this run's workflow was read from, not the
      # branch: a branch that moved or was deleted since must reach the script's
      # "moved" exit rather than fail the checkout.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # The each-follow-up action runs the store scripts from here (`scripts-dir`).
          sparse-checkout: scripts
          filter: blob:none

      - uses: cynkra/cynkratemplate/.github/actions/each-follow-up@claude/each-actions
        with:
          token: ${{ github.token }}
          inputs: ${{ toJSON(inputs) }}
          # The file of this workflow: the dispatch target, also when it is reached through `workflow_call`.
          workflow: each.yaml
